name: Expression migration gates

on:
  pull_request:
  create:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  migration-gates:
    name: Expression migration gates
    if: github.event_name != 'create' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    outputs:
      stable_release_tag: ${{ steps.release-tag.outputs.is_stable }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Identify and verify release tag
        id: release-tag
        if: github.event_name == 'create' && github.ref_type == 'tag'
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse --verify "${GITHUB_REF}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out tag does not match the triggering commit."
            exit 1
          fi
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Legacy unit suite
        run: yarn test
        env:
          TZ: America/Los_Angeles

      - name: Build runtime bundles and public declarations
        run: yarn build

      - name: Strict isolated migration typecheck
        run: yarn typecheck:migration

      - name: Public declaration scope and reproducibility
        run: yarn test:types:check && git diff --exit-code -- ts/api.ts

      - name: Legacy contract suite
        run: yarn test:contracts:legacy

      - name: Hybrid contracts and legacy differential
        run: yarn test:contracts:hybrid

      - name: Deterministic artifact integrity
        run: yarn build:verify

      - name: Deployment path regression checks
        run: yarn test:deploy

  deploy-production:
    name: Deploy to S3 (release tag only)
    needs: migration-gates
    if: success() && github.event_name == 'create' && github.ref_type == 'tag' && needs.migration-gates.outputs.stable_release_tag == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.repository }}-expression-production-deploy
      cancel-in-progress: false
      queue: max
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering tag
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse --verify "${GITHUB_REF}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out tag does not match the triggering commit."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Build release bundles
        run: yarn build && yarn test:types:check && git diff --exit-code -- ts/api.ts && yarn build:verify

      - name: Validate AWS release configuration
        env:
          AWS_ROLE_ARN: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_ROLE_ARN in the production environment."
            exit 1
          fi
          if [[ -z "${AWS_REGION}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_REGION in the production environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}

      - name: Reject stale production release
        run: |
          git ls-remote --tags origin > "$RUNNER_TEMP/expression-release-tags"
          node <<'NODE'
          const fs = require('node:fs');
          const pattern = /^refs\/tags\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const current = pattern.exec(process.env.GITHUB_REF || '');
          if (!current) throw new Error('The deployment ref is not a stable release tag.');
          const currentVersion = current.slice(1).map(BigInt);
          let tagObject;
          let peeledTag;
          for (const line of fs.readFileSync(`${process.env.RUNNER_TEMP}/expression-release-tags`, 'utf8').trim().split('\n')) {
            const match = /^([0-9a-f]{40,64})\t(refs\/tags\/[^\s^]+)(\^\{\})?$/.exec(line);
            if (!match) throw new Error('Unable to parse the remote tag listing.');
            if (match[2] === process.env.GITHUB_REF) {
              if (match[3]) {
                if (peeledTag) throw new Error('Duplicate peeled release tag in remote listing.');
                peeledTag = match[1];
              } else {
                if (tagObject) throw new Error('Duplicate release tag in remote listing.');
                tagObject = match[1];
              }
            }
            if (match[3]) continue;
            const tag = pattern.exec(match[2]);
            if (!tag) continue;
            const version = tag.slice(1).map(BigInt);
            for (let i = 0; i < version.length; i++) {
              if (version[i] > currentVersion[i]) {
                throw new Error(`A newer stable release tag exists: ${match[2]}. Refusing to deploy ${process.env.GITHUB_REF}.`);
              }
              if (version[i] < currentVersion[i]) break;
            }
          }
          if (!tagObject) throw new Error('The triggering release tag no longer exists on origin.');
          if ((peeledTag || tagObject) !== process.env.GITHUB_SHA) {
            throw new Error('The remote release tag no longer points to the triggering commit.');
          }
          NODE

      - name: Publish legacy and hybrid bundles
        run: ./script/deploy production --yes
