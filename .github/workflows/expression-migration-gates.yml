name: Expression migration gates

on:
  pull_request:
  create:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  classify-tag:
    name: Identify stable release tag
    if: github.event_name == 'create' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.classify.outputs.is_stable }}
    steps:
      - name: Classify tag
        id: classify
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

  migration-gates:
    name: Expression migration gates
    needs: classify-tag
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (github.event_name == 'create' && github.ref_type == 'tag' && needs.classify-tag.result == 'success' && needs.classify-tag.outputs.is_stable == 'true')) }}
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    outputs:
      stable_release_tag: ${{ steps.release-tag.outputs.is_stable }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'create' && github.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Identify and verify release tag
        id: release-tag
        if: github.event_name == 'create' && github.ref_type == 'tag'
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse --verify "${GITHUB_REF}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out tag does not match the triggering commit."
            exit 1
          fi
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Legacy unit suite
        run: yarn test
        env:
          TZ: America/Los_Angeles

      - name: Build runtime bundles and public declarations
        run: yarn build

      - name: Strict isolated migration typecheck
        run: yarn typecheck:migration

      - name: Public declaration scope and reproducibility
        run: yarn test:types:check && git diff --exit-code -- ts/api.ts

      - name: Legacy contract suite
        run: yarn test:contracts:legacy

      - name: Hybrid contracts and legacy differential
        run: yarn test:contracts:hybrid

      - name: Deterministic artifact integrity
        run: yarn build:verify

      - name: Deployment path regression checks
        run: yarn test:deploy

  deploy-production:
    name: Deploy to S3 (release tag only)
    needs: migration-gates
    if: success() && github.event_name == 'create' && github.ref_type == 'tag' && needs.migration-gates.outputs.stable_release_tag == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: ${{ github.repository }}-expression-production-deploy
      cancel-in-progress: false
      queue: max
    env:
      COREPACK_ENABLE_AUTO_PIN: '0'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify triggering tag
        run: |
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] ||
             [[ "$(git rev-parse --verify "${GITHUB_REF}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::The checked-out tag does not match the triggering commit."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Build release bundles
        run: yarn build && yarn test:types:check && git diff --exit-code -- ts/api.ts && yarn build:verify

      - name: Validate AWS release configuration
        env:
          AWS_ROLE_ARN: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_ROLE_ARN in the production environment."
            exit 1
          fi
          if [[ -z "${AWS_REGION}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_REGION in the production environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}

      - name: Reject stale production release
        run: node .github/actions/npm-common/remote-tag.js --reject-newer

      - name: Publish legacy and hybrid bundles
        env:
          EXPRESSION_SANDBOX_ALLOWED_ORIGINS: ${{ vars.EXPRESSION_SANDBOX_ALLOWED_ORIGINS }}
        run: ./script/deploy production --yes
