name: Expression migration gates

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  migration-gates:
    name: Expression migration gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Protect release-managed version
        if: github.event_name == 'merge_group' || github.base_ref == 'main' || github.ref == 'refs/heads/main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const base = process.env.BASE_SHA || '';
          if (!/^[0-9a-f]{40,64}$/.test(base) || /^0+$/.test(base)) {
            console.error('::error::Cannot determine the base commit for the release version check.');
            process.exit(1);
          }
          function version(ref) {
            let manifest;
            try {
              manifest = JSON.parse(execFileSync('git', ['show', `${ref}:package.json`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }));
            } catch (error) {
              console.error(`::error::Cannot read or parse package.json at ${ref}: ${error.message}`);
              process.exit(1);
            }
            if (!manifest || typeof manifest.version !== 'string' || !manifest.version.trim()) {
              console.error(`::error::package.json at ${ref} must have a nonempty version string.`);
              process.exit(1);
            }
            return manifest.version;
          }
          if (version(base) !== version('HEAD')) {
            console.error('::error file=package.json::Do not manually change the root package.json version. Revert that version change; GitHub Actions manages release versions.');
            process.exit(1);
          }
          NODE

      - name: Test release workflow contracts
        run: node --test .github/tests/*.cjs

      - name: Preserve CI configuration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-ci-config-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci/config.yaml
          if-no-files-found: error

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Legacy unit suite
        run: yarn test
        env:
          TZ: America/Los_Angeles

      - name: Build runtime bundles and public declarations
        run: yarn build

      - name: Strict isolated migration typecheck
        run: yarn typecheck:migration

      - name: Public declaration scope and reproducibility
        run: yarn test:types:check && git diff --exit-code -- ts/api.ts

      - name: Legacy contract suite
        run: yarn test:contracts:legacy

      - name: Hybrid contracts and legacy differential
        run: yarn test:contracts:hybrid

      - name: Deterministic artifact integrity
        run: yarn build:verify

      - name: Deployment path regression checks
        run: yarn test:deploy

  deploy-production:
    name: Deploy to S3 (main only)
    needs: migration-gates
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Build release bundles
        run: yarn build && yarn test:types:check && git diff --exit-code -- ts/api.ts && yarn build:verify

      - name: Validate AWS release configuration
        env:
          AWS_ROLE_ARN: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_ROLE_ARN in the production environment."
            exit 1
          fi
          if [[ -z "${AWS_REGION}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_REGION in the production environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}

      - name: Publish legacy and hybrid bundles
        run: ./script/deploy production --yes

  build-and-test:
    if: always()
    needs: migration-gates
    runs-on: ubuntu-latest
    steps:
      - name: Require migration gates to succeed
        env:
          CI_RESULT: ${{ needs.migration-gates.result }}
        run: |
          if [ "$CI_RESULT" != success ]; then
            echo "::error::Migration gates did not succeed: $CI_RESULT"
            exit 1
          fi

  tag:
    name: Create npm release tag
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.repository }}-npm-release-tag
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.FULCRUM_CI_APP_ID }}
          private-key: ${{ secrets.FULCRUM_CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit release version to main and tag it
        uses: ./.github/actions/npm-create-tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_NPMJS: 'false'
