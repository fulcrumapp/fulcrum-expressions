name: Expression migration gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  migration-gates:
    name: Expression migration gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Legacy unit suite
        run: yarn test
        env:
          TZ: America/Los_Angeles

      - name: Build runtime bundles and public declarations
        run: yarn build

      - name: Strict isolated migration typecheck
        run: yarn typecheck:migration

      - name: Public declaration scope and reproducibility
        run: yarn test:types && git diff --exit-code -- ts/api.ts

      - name: Legacy contract suite
        run: yarn test:contracts:legacy

      - name: Hybrid contracts and legacy differential
        run: yarn test:contracts:hybrid

      - name: Deterministic artifact integrity
        run: yarn build:verify

  deploy-production:
    name: Release expression bundles to S3
    needs: migration-gates
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install locked dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Set up Ruby for public declarations
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Build release bundles
        run: yarn build && yarn test:types && git diff --exit-code -- ts/api.ts && yarn build:verify

      - name: Validate AWS release configuration
        env:
          AWS_ROLE_ARN: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_ROLE_ARN in the production environment."
            exit 1
          fi
          if [[ -z "${AWS_REGION}" ]]; then
            echo "::error::Set EXPRESSION_RELEASE_AWS_REGION in the production environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.EXPRESSION_RELEASE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EXPRESSION_RELEASE_AWS_REGION }}

      - name: Publish legacy and hybrid bundles
        run: ./script/deploy production --yes --skip-compatibility
